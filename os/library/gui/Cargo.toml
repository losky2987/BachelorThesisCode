[package]
edition = "2024"
name = "gui"
version = "1.0.1"
authors = ["Xiaochen Xing <xixin100@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[dependencies]
runtime = { path = "../../library/runtime" }
naming = { path = "../../library/naming" }
syscall = { path = "../../library/syscall" }
terminal = { path = "../../library/terminal" }
concurrent = { path = "../../library/concurrent" }
drawer = { path = "../../library/drawer" }
graphic = { path = "../../library/graphic" }
input = { path = "../../library/input" }
time = { path = "../../library/time" }
globals = { path = "../../library/globals" }
text_buffer = { path = "../../library/text_buffer" }
syntax = { path = "../../library/syntax" }

spin = "0.9.8"
pc-keyboard = "0.8.0"
log = "0.4.26"
unifont = "1.1.0"

nolock = { version = "0.4.1", default-features = false, features = ["queues"] }
chrono = { version = "0.4.42", default-features = false, features = ["alloc"] }
libm = "0.2.8"
pulldown-cmark = { git = "https://github.com/pulldown-cmark/pulldown-cmark.git", version = "0.13.0", default-features = false, features = ["hashbrown"] }
hashbrown = "0.14.5"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
