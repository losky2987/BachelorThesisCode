[package]
edition = "2021"
name = "window_manager"
version = "0.1.0"
authors = ["Artur Herdt", "Xiaochen Xing"]

[lib]
crate-type = ["staticlib"]
path = "src/window_manager.rs"
test = false
doctest = false
bench = false


[features]
default = ["with_runtime"]
with_runtime = []

[dependencies]
# Local dependencies
runtime = { path = "../../library/runtime" }
# io = { path = "../../library/io" }
terminal = { path = "../../library/terminal" }
concurrent = { path = "../../library/concurrent" }
drawer = { path = "../../library/drawer" }
graphic = { path = "../../library/graphic" }
time = { path = "../../library/time" }
input = { path = "../../library/input" }
globals = { path = "../../library/globals" }
gui = { path = "../../library/gui" }

hashbrown = "0.14.5"
spin = "0.9.8"
chrono = { version = "0.4.42", default-features = false, features = ["alloc"] }
pc-keyboard = "0.8.0"
